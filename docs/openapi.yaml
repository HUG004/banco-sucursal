openapi: 3.0.3
info:
  title: API de Sucursal Bancaria — Nodo 2
  version: 1.0.0
  description: |
    API REST Express del Nodo 2. Las operaciones bancarias se delegan al
    Banco Central (Laravel) mediante una API Key del servidor.
    Las rutas /api/banco requieren autorización administrativa de sucursal.
    La forma exacta de ciertos cuerpos y respuestas bancarias depende del
    controlador del Nodo 2 y del contrato del Banco Central.
servers:
  - url: https://banco-sucursal-five.vercel.app
    description: Producción
  - url: http://localhost:3002
    description: Desarrollo local
tags:
  - name: Salud
  - name: Autenticación
  - name: Cuentas
  - name: Transferencias
  - name: Sucursal
paths:
  /api/salud:
    get:
      tags: [Salud]
      summary: Comprobar estado del servidor
      responses:
        '200':
          description: Servidor disponible
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado: {type: string, example: OK}
                  servicio: {type: string, example: 'Nodo 2 - Sucursal Bancaria'}
                  mensaje: {type: string}
  /api/auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión administrativa
      description: Requiere encabezado Origin del mismo sitio. Establece cookie HttpOnly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clave]
              properties:
                clave: {type: string, format: password}
      responses:
        '200': {description: Sesión iniciada; se establece cookie de sesión}
        '401': {description: Credenciales incorrectas}
        '403': {description: Origen no autorizado}
        '503': {description: Autenticación no configurada}
  /api/auth/estado:
    get:
      tags: [Autenticación]
      summary: Consultar estado de la sesión
      responses:
        '200':
          description: Estado de autenticación
          content:
            application/json:
              schema:
                type: object
                properties:
                  autenticado: {type: boolean}
  /api/auth/logout:
    post:
      tags: [Autenticación]
      summary: Cerrar sesión administrativa
      description: Requiere encabezado Origin del mismo sitio.
      responses:
        '200': {description: Sesión cerrada}
        '403': {description: Origen no autorizado}
  /api/banco/cuentas:
    post:
      tags: [Cuentas]
      summary: Crear cuenta en el Banco Central
      security: [{sesionSucursal: []}, {claveSucursal: []}]
      description: El cuerpo se valida en el controlador y se remite a POST /api/accounts del Banco Central.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Datos de apertura definidos por el contrato del Banco Central.
      responses:
        '200': {description: Respuesta del controlador / Banco Central}
        '201': {description: Cuenta creada}
        '400': {description: Solicitud inválida}
        '401': {description: Sin autorización}
        '422': {description: Error de validación}
        '503': {description: Banco Central no disponible}
  /api/banco/saldo/{numeroCuenta}:
    get:
      tags: [Cuentas]
      summary: Consultar saldo de cuenta
      security: [{sesionSucursal: []}, {claveSucursal: []}]
      parameters:
        - $ref: '#/components/parameters/numeroCuenta'
      responses:
        '200': {description: Saldo obtenido del Banco Central}
        '401': {description: Sin autorización}
        '404': {description: Cuenta no encontrada}
  /api/banco/transferencias:
    post:
      tags: [Transferencias]
      summary: Realizar transferencia bancaria
      security: [{sesionSucursal: []}, {claveSucursal: []}]
      description: Operación delegada a POST /api/transfer del Banco Central; el servicio utiliza clave de idempotencia.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Campos de transferencia definidos por el controlador y el Banco Central.
      responses:
        '200': {description: Resultado de la transferencia}
        '201': {description: Transferencia registrada}
        '400': {description: Solicitud inválida}
        '401': {description: Sin autorización}
        '422': {description: Error de validación}
        '503': {description: Banco Central no disponible}
  /api/banco/sucursal:
    get:
      tags: [Sucursal]
      summary: Consultar datos de la sucursal autenticada
      security: [{sesionSucursal: []}, {claveSucursal: []}]
      responses:
        '200': {description: Datos de la sucursal desde /api/nodes/me}
        '401': {description: Sin autorización}
  /api/banco/sucursal/transacciones:
    get:
      tags: [Sucursal]
      summary: Consultar transacciones atribuidas a la sucursal
      security: [{sesionSucursal: []}, {claveSucursal: []}]
      parameters:
        - $ref: '#/components/parameters/type'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/limit'
      responses:
        '200': {description: Historial de transacciones de la sucursal}
        '401': {description: Sin autorización}
  /api/banco/cuentas/{numeroCuenta}/transacciones:
    get:
      tags: [Cuentas]
      summary: Consultar historial de una cuenta
      security: [{sesionSucursal: []}, {claveSucursal: []}]
      parameters:
        - $ref: '#/components/parameters/numeroCuenta'
        - $ref: '#/components/parameters/type'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/limit'
      responses:
        '200': {description: Historial de la cuenta}
        '401': {description: Sin autorización}
        '404': {description: Cuenta no encontrada}
  /api/banco/sucursal/reportes:
    get:
      tags: [Sucursal]
      summary: Consultar reportes administrativos reales
      security: [{sesionSucursal: []}, {claveSucursal: []}]
      parameters:
        - $ref: '#/components/parameters/type'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
      responses:
        '200': {description: Reporte del Banco Central para la sucursal}
        '401': {description: Sin autorización}
  /api/banco/cuentas/buscar:
    get:
      tags: [Cuentas]
      summary: Buscar cuentas en el Banco Central
      security: [{sesionSucursal: []}, {claveSucursal: []}]
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string}
          description: Término de búsqueda
      responses:
        '200': {description: Resultado de búsqueda de cuentas}
        '401': {description: Sin autorización}
components:
  securitySchemes:
    sesionSucursal:
      type: apiKey
      in: cookie
      name: sucursal_session
      description: Cookie firmada emitida por POST /api/auth/login.
    claveSucursal:
      type: apiKey
      in: header
      name: X-Sucursal-Key
      description: Clave administrativa admitida por el middleware del Nodo 2; no confundir con X-API-Key del Banco Central.
  parameters:
    numeroCuenta:
      name: numeroCuenta
      in: path
      required: true
      schema: {type: string}
      description: Número de cuenta bancaria
    type:
      name: type
      in: query
      required: false
      schema: {type: string, enum: [deposit, withdrawal, transfer]}
    from:
      name: from
      in: query
      required: false
      schema: {type: string, format: date}
    to:
      name: to
      in: query
      required: false
      schema: {type: string, format: date}
    limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1}
